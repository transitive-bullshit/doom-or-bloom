<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Doom or Bloom — Launch Video</title>
    <style>
      html,
      body {
        margin: 0;
        background: #000;
        overflow: hidden;
      }
      #out {
        display: block;
        width: 1920px;
        height: 1080px;
      }
      body.preview {
        display: grid;
        place-items: center;
        height: 100vh;
        overflow: hidden;
      }
      body.preview #out {
        width: min(100vw, calc((100vh - 56px) * 16 / 9));
        height: auto;
        aspect-ratio: 16 / 9;
      }
      #bar {
        display: none;
      }
      body.preview #bar {
        display: flex;
        gap: 12px;
        align-items: center;
        width: min(100vw, calc((100vh - 56px) * 16 / 9));
        height: 40px;
        color: #ddd;
        font:
          13px ui-monospace,
          monospace;
      }
      #track {
        flex: 1;
        height: 8px;
        background: #333;
        border-radius: 4px;
        cursor: pointer;
        position: relative;
      }
      #fill {
        position: absolute;
        inset: 0 auto 0 0;
        background: linear-gradient(90deg, #ff786a, #ffb88b, #e6ff80, #aaffbd);
        border-radius: 4px;
      }
      button {
        background: #222;
        color: #eee;
        border: 1px solid #444;
        border-radius: 6px;
        padding: 4px 10px;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <canvas id="out"></canvas>
    <div id="bar">
      <button id="play">Play</button>
      <div id="track"><div id="fill"></div></div>
      <span id="clock">0.00s</span>
    </div>
    <audio id="audio" src="soundtrack.wav" preload="auto"></audio>
    <script type="module" src="dist/main.js"></script>
  </body>
</html>
