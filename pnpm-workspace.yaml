allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  core-js: false
  esbuild: true
  simple-git-hooks: true

enablePrePostScripts: true

# oxfmt is pinned in package.json: 0.72.0 crashes formatting docs/BLOG.md
# with "Expected end tag of kind LineSuffix but found LineSuffix".

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@fisch0920/config'
